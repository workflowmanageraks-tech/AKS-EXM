<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mut:#667;--pri:#4f46e5;--bd:#e2e5ee;--red:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1c1f2a;--tx:#eceef5;--mut:#9aa0b4;--bd:#2d3142}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2,h3{margin:0 0 10px}
input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;margin-bottom:8px}
button{background:var(--pri);color:#fff;border:0;cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;gap:8px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top button{width:auto;padding:6px 12px;margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.x{color:var(--red);cursor:pointer;border:0;background:none;width:auto;padding:0;margin:0}
.tot{font-size:20px;font-weight:700;margin:8px 0}
.err{color:var(--red);min-height:20px}
.wrap{overflow-x:auto}
.hide{display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="card">
  <h2>💰 Expense Tracker</h2>
  <input id="lu" placeholder="Username" autocapitalize="off">
  <input id="lp" type="password" placeholder="Password">
  <button onclick="doLogin()">Login</button>
  <div class="err" id="le"></div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <div class="top"><b id="who"></b><button class="sec" onclick="logout()">Logout</button></div>

  <div class="card">
    <h3>Naya kharcha</h3>
    <div class="row"><input id="ed" type="date"><input id="ea" type="number" placeholder="Amount ₹"></div>
    <select id="ec"></select>
    <input id="en" placeholder="Note (optional)">
    <button onclick="addExpense()">Add Expense</button>
    <div class="row">
      <input id="nc" placeholder="Nayi category">
      <button class="sec" onclick="addCategory()">+ Category</button>
    </div>
  </div>

  <div class="card">
    <h3>Kharche</h3>
    <div class="row">
      <input id="fm" type="month" onchange="render()">
      <select id="fu" class="hide" onchange="render()"></select>
      <select id="fg" class="hide" onchange="render()"></select>
    </div>
    <div class="tot" id="tot"></div>
    <div class="wrap"><table id="tb"></table></div>
    <button class="sec" onclick="pdf()" style="margin-top:10px">📄 PDF Download</button>
  </div>

  <div class="card hide" id="admin">
    <h3>Admin: User aur Group</h3>
    <div class="row">
      <input id="gn" placeholder="Naya group (jaise Family)">
      <button class="sec" onclick="addGroup()">+ Group</button>
    </div>
    <input id="un" placeholder="User ka naam">
    <div class="row"><input id="uu" placeholder="Username" autocapitalize="off"><input id="up" placeholder="Password"></div>
    <div class="row"><select id="ur"><option value="user">User</option><option value="admin">Admin</option></select><select id="ug"></select></div>
    <button onclick="addUser()">Create User</button>
    <div class="wrap"><table id="ut"></table></div>
  </div>
  <div class="err" id="ae"></div>
</div>

<script>
// ====== Yahan apna Apps Script Web App URL daalo ======
const API_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";
// ======================================================

let cred = null, D = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(action, extra = {}) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflight se bachne ke liye
    body: JSON.stringify({ ...cred, action, ...extra })
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

async function doLogin() {
  cred = { username: $('lu').value.trim(), password: $('lp').value };
  $('le').textContent = 'Please wait...';
  try {
    D = await api('login');
    try { sessionStorage.setItem('cred', JSON.stringify(cred)); } catch (e) {}
    show();
  } catch (e) { $('le').textContent = e.message; cred = null; }
}
function logout() {
  try { sessionStorage.removeItem('cred'); } catch (e) {}
  location.reload();
}
async function reload() {
  try { D = await api('list'); render(); $('ae').textContent = ''; }
  catch (e) { $('ae').textContent = e.message; }
}
async function act(action, extra, after) {
  try { await api(action, extra); await reload(); if (after) after(); }
  catch (e) { $('ae').textContent = e.message; }
}

function show() {
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  const admin = D.me.role === 'admin';
  $('who').textContent = '👤 ' + D.me.name + (admin ? ' (Admin)' : '') + (D.me.group ? ' · 👥 ' + D.me.group : '');
  $('admin').classList.toggle('hide', !admin);
  $('fu').classList.toggle('hide', !admin);
  $('fg').classList.toggle('hide', !admin);
  $('ed').value = new Date().toISOString().slice(0, 10);
  $('fm').value = new Date().toISOString().slice(0, 7);
  render();
}

function opts(arr, first) {
  return (first ? `<option value="">${first}</option>` : '') + arr.map(x => `<option>${esc(x)}</option>`).join('');
}

function filtered() {
  const m = $('fm').value, u = $('fu').value, g = $('fg').value;
  return D.expenses.filter(e => (!m || String(e.date).startsWith(m)) && (!u || e.username === u) && (!g || e.group === g))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

function render() {
  const cur = $('ec').value;
  $('ec').innerHTML = opts(D.categories);
  if (cur) $('ec').value = cur;
  if (D.me.role === 'admin') {
    const fu = $('fu').value, fg = $('fg').value;
    $('fu').innerHTML = opts(D.users.map(u => u.username), 'Sab users');
    $('fg').innerHTML = opts(D.groups, 'Sab groups');
    $('fu').value = fu; $('fg').value = fg;
    $('ug').innerHTML = opts(D.groups, 'Koi group nahi');
    $('ut').innerHTML = '<tr><th>User</th><th>Role</th><th>Group</th></tr>' +
      D.users.map(u => `<tr><td>${esc(u.name)} (${esc(u.username)})</td><td>${esc(u.role)}</td><td>${esc(u.group)}</td></tr>`).join('');
  }
  const list = filtered();
  const total = list.reduce((s, e) => s + Number(e.amount), 0);
  $('tot').textContent = 'Total: ₹' + total.toLocaleString('en-IN');
  const showUser = D.me.role === 'admin' || !!D.me.group;
  $('tb').innerHTML = `<tr><th>Date</th><th>Category</th><th>₹</th>${showUser ? '<th>Kisne</th>' : ''}<th></th></tr>` +
    list.map(e => `<tr><td>${esc(e.date)}</td><td>${esc(e.category)}<br><small>${esc(e.note)}</small></td><td>${esc(e.amount)}</td>` +
      `${showUser ? `<td>${esc(e.username)}<br><small>${esc(e.group)}</small></td>` : ''}` +
      `<td><button class="x" onclick="del('${esc(e.id)}')">✕</button></td></tr>`).join('');
}

function addExpense() {
  act('addExpense', { date: $('ed').value, amount: $('ea').value, category: $('ec').value, note: $('en').value },
    () => { $('ea').value = ''; $('en').value = ''; });
}
function del(id) { if (confirm('Delete karein?')) act('deleteExpense', { id }); }
function addCategory() { act('addCategory', { name: $('nc').value }, () => $('nc').value = ''); }
function addGroup() { act('addGroup', { name: $('gn').value }, () => $('gn').value = ''); }
function addUser() {
  act('addUser', { newName: $('un').value, newUsername: $('uu').value, newPassword: $('up').value, newRole: $('ur').value, newGroup: $('ug').value },
    () => { $('un').value = $('uu').value = $('up').value = ''; });
}

function pdf() {
  const list = filtered();
  const doc = new jspdf.jsPDF();
  const admin = D.me.role === 'admin' || !!D.me.group;
  doc.setFontSize(16); doc.text('Expense Report', 14, 15);
  doc.setFontSize(10); doc.text(`${D.me.name} | ${$('fm').value || 'All'} | Generated ${new Date().toLocaleDateString('en-IN')}`, 14, 22);
  doc.autoTable({
    startY: 28,
    head: [['Date', 'Category', 'Note', 'Amount (Rs)'].concat(admin ? ['User', 'Group'] : [])],
    body: list.map(e => [e.date, e.category, e.note, e.amount].concat(admin ? [e.username, e.group] : [])),
    foot: [['', '', 'Total', list.reduce((s, e) => s + Number(e.amount), 0)].concat(admin ? ['', ''] : [])]
  });
  doc.save('expenses.pdf');
}

// group ke dusre member ke changes apne aap dikhne ke liye: har 15 sec me refresh
setInterval(() => { if (D && cred && !document.hidden) reload(); }, 15000);
document.addEventListener('visibilitychange', () => { if (D && cred && !document.hidden) reload(); });

// refresh ke baad dobara login na karna pade
window.addEventListener('load', async () => {
  try {
    const c = sessionStorage.getItem('cred');
    if (c) { cred = JSON.parse(c); D = await api('login'); show(); }
  } catch (e) { cred = null; }
});
</script>
</body>
</html>
