<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #4f46e5;
      --good: #16a34a;
      --bad: #dc2626;
      --good-bg: #dcfce7;
      --bad-bg: #fee2e2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; max-width: 900px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 700; }

    .btn { background: var(--brand); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .btn.danger { background: var(--bad); }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--line); }
    .kpi .lbl { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .kpi .val { font-size: 22px; font-weight: 700; }
    .kpi.income .val { color: var(--good); }
    .kpi.expense .val { color: var(--bad); }

    .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--line); padding: 16px; margin-bottom: 20px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .select, .input { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; background: #fff; }

    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 12px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .amt-inc { color: var(--good); font-weight: 600; text-align: right; }
    .amt-exp { color: var(--bad); font-weight: 600; text-align: right; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 500; }
    .pill.inc { background: var(--good-bg); color: var(--good); }
    .pill.exp { background: var(--bad-bg); color: var(--bad); }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .overlay.hidden { display: none; }
    .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 420px; padding: 20px; }
    .modal h3 { margin-bottom: 16px; }
    .field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

    #toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; display: none; z-index: 200; }
  </style>
</head>
<body>

  <header>
    <h1>💸 Expense Tracker</h1>
    <button class="btn" onclick="openModal()">＋ Add Entry</button>
  </header>

  <div class="kpis">
    <div class="kpi income">
      <div class="lbl">Total Income</div>
      <div class="val" id="totalInc">₹0.00</div>
    </div>
    <div class="kpi expense">
      <div class="lbl">Total Expense</div>
      <div class="val" id="totalExp">₹0.00</div>
    </div>
    <div class="kpi">
      <div class="lbl">Balance</div>
      <div class="val" id="totalBal">₹0.00</div>
    </div>
  </div>

  <div class="card">
    <div class="actions">
      <select class="select" id="catFilter" onchange="renderTable()">
        <option value="all">All Categories</option>
      </select>
      <input class="input" type="text" id="searchInput" placeholder="Search note..." oninput="renderTable()" style="flex: 1;">
      <button class="btn ghost" onclick="fetchData()">↻ Refresh</button>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Note</th>
            <th style="text-align: right;">Amount</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="txBody">
          <tr><td colspan="5" style="text-align: center; color: var(--muted);">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Entry Modal -->
  <div class="overlay hidden" id="modal">
    <div class="modal">
      <h3 id="modalTitle">Add Entry</h3>
      <form id="entryForm" onsubmit="saveEntry(event)">
        <input type="hidden" id="entryId">
        <div class="field">
          <label>Date</label>
          <input class="input" type="date" id="formDate" required>
        </div>
        <div class="field">
          <label>Amount (₹)</label>
          <input class="input" type="number" step="0.01" id="formAmount" required placeholder="0.00">
        </div>
        <div class="field">
          <label>Category</label>
          <select class="select" id="formCat" required></select>
        </div>
        <div class="field">
          <label>Note</label>
          <input class="input" type="text" id="formNote" placeholder="Optional details" maxlength="300">
        </div>
        <div class="modal-foot">
          <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // Google Apps Script Web App URL यहाँ पेस्ट करें
    const API_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

    let expenses = [];
    let categories = [];

    const toast = (msg) => {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2600);
    };

    const callApi = async (action, data = {}) => {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...data })
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Request failed');
      return json;
    };

    const fetchData = async () => {
      try {
        const res = await callApi('getAllExpenses');
        expenses = res.expenses || [];
        categories = res.categories || [];
        setupFilters();
        renderTable();
      } catch (err) {
        toast(err.message);
      }
    };

    const setupFilters = () => {
      const filter = document.getElementById('catFilter');
      const formCat = document.getElementById('formCat');
      
      const filterOpts = ['<option value="all">All Categories</option>']
        .concat(categories.map(c => `<option value="${c.name}">${c.name}</option>`));
      filter.innerHTML = filterOpts.join('');

      const formOpts = categories.map(c => `<option value="${c.name}">${c.name} (${c.type})</option>`);
      formCat.innerHTML = formOpts.join('');
    };

    const renderTable = () => {
      const cat = document.getElementById('catFilter').value;
      const q = document.getElementById('searchInput').value.trim().toLowerCase();

      let inc = 0, exp = 0;
      expenses.forEach(x => {
        const c = categories.find(k => k.name === x.category);
        const type = c ? c.type : 'Expense';
        if (type === 'Income') inc += Number(x.amount);
        else exp += Number(x.amount);
      });

      document.getElementById('totalInc').textContent = '₹' + inc.toFixed(2);
      document.getElementById('totalExp').textContent = '₹' + exp.toFixed(2);
      document.getElementById('totalBal').textContent = '₹' + (inc - exp).toFixed(2);

      const filtered = expenses.filter(x => {
        const mCat = cat === 'all' || x.category === cat;
        const mQ = !q || (x.note + ' ' + x.category).toLowerCase().includes(q);
        return mCat && mQ;
      }).sort((a, b) => b.date.localeCompare(a.date));

      const tbody = document.getElementById('txBody');
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--muted);">No records found</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(x => {
        const c = categories.find(k => k.name === x.category);
        const type = c ? c.type : 'Expense';
        const isInc = type === 'Income';
        return `
          <tr>
            <td>${x.date}</td>
            <td><span class="pill ${isInc ? 'inc' : 'exp'}">${x.category}</span></td>
            <td>${x.note || '—'}</td>
            <td class="${isInc ? 'amt-inc' : 'amt-exp'}">${isInc ? '+' : '-'}₹${Number(x.amount).toFixed(2)}</td>
            <td style="text-align: right;">
              <button class="btn ghost" style="padding: 4px 8px; font-size: 12px;" onclick="editEntry('${x.id}')">Edit</button>
              <button class="btn ghost" style="padding: 4px 8px; font-size: 12px; color: var(--bad);" onclick="delEntry('${x.id}')">🗑</button>
            </td>
          </tr>
        `;
      }).join('');
    };

    const openModal = (item = null) => {
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = item ? 'Edit Entry' : 'Add Entry';
      document.getElementById('entryId').value = item ? item.id : '';
      document.getElementById('formDate').value = item ? item.date : new Date().toISOString().slice(0, 10);
      document.getElementById('formAmount').value = item ? item.amount : '';
      document.getElementById('formCat').value = item ? item.category : (categories[0] ? categories[0].name : '');
      document.getElementById('formNote').value = item ? item.note : '';
    };

    const closeModal = () => {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('entryForm').reset();
    };

    const saveEntry = async (e) => {
      e.preventDefault();
      const id = document.getElementById('entryId').value;
      const data = {
        date: document.getElementById('formDate').value,
        amount: Number(document.getElementById('formAmount').value),
        category: document.getElementById('formCat').value,
        note: document.getElementById('formNote').value
      };

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        if (id) {
          const res = await callApi('updateExpense', { id, ...data });
          const idx = expenses.findIndex(x => x.id === id);
          if (idx !== -1) expenses[idx] = res.expense;
        } else {
          const res = await callApi('addExpense', data);
          expenses.push(res.expense);
        }
        closeModal();
        renderTable();
        toast('Entry saved successfully!');
      } catch (err) {
        toast(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save';
      }
    };

    const editEntry = (id) => {
      const item = expenses.find(x => x.id === id);
      if (item) openModal(item);
    };

    const delEntry = async (id) => {
      if (!confirm('Are you sure you want to delete this entry?')) return;
      try {
        await callApi('deleteExpense', { id });
        expenses = expenses.filter(x => x.id !== id);
        renderTable();
        toast('Entry deleted!');
      } catch (err) {
        toast(err.message);
      }
    };

    window.onload = () => {
      if (API_URL.includes('YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE')) {
        alert('कृपया API_URL में अपनी Apps Script की Web App लिंक पेस्ट करें!');
      } else {
        fetchData();
      }
    };
  </script>
</body>
</html>
